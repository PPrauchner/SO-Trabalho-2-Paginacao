# Grade de experimentos — único lugar onde ficam os valores da grade.
#
# Lido por scripts/run_grid.sh (`make grid`). Listas separadas por espaço.
# Valores definitivos, escolhidos na rodada exploratória (#8) — justificativa em
# docs/adr/0001-parametros-da-grade.md.

# Traces, sem a extensão: cada um é lido de traces/<nome>.trace. O bigone é a
# concatenação dos outros quatro, na ordem abaixo.
TRACES="bzip gcc sixpack swim bigone"

# Números de frames simulados em todas as políticas.
FRAMES="4 8 12 16 20 24 28 32 36 40 44 48 52 56 60 64"

# Pares N:I do LRU aproximado — bits de histórico : intervalo de envelhecimento.
# Referência 8:100 (a mesma de scripts/plot.py); os demais variam I com N=8 e N com
# I=100, para os gráficos de sensibilidade.
LRU_PAIRS="8:100 8:10 8:1000 8:10000 8:100000 1:100 2:100 4:100 16:100"
